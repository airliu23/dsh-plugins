- insert:
    - id: dsh-team
      name: '@local/dsh-team'
      config:
        # Empty = <DSH_HOME>/dsh-team. Tickets, worktrees and worker logs live here.
        stateDir: ''
        # How many Headless workers may run at once.
        maxWorkers: 3
        # Kill a worker that runs longer than this.
        timeoutMs: 3600000
        # The `dsh` executable used to start a worker; empty = look it up on PATH.
        dshBin: ''
        # Push the finished report back into the Session that posted the ticket.
        notify: true
        # How much of the report a pushed notification carries; the rest stays in reply.md.
        notifyMaxChars: 4000
