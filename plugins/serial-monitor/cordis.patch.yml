- insert:
    - id: serial-monitor
      name: '@local/serial-monitor'
      config:
        pythonPath: python
        autoStart: true
        # 4 M chars across a chunked ring (~26 s of wire at 1.5 Mbaud).
        ringChars: 4000000
        # Seed only: the Session owns the list (`serial_monitor watch`), and its
        # choice is remembered in %TEMP%/dsh-serial-monitor/declared.json.
        streams:
          - port: COM23
            baud: 9600
